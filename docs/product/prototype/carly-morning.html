<title>Squad - Credit Analyst agent demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ECE8FF%22/%3E%3Cg fill=%22%238F7BF0%22%3E%3Ccircle cx=%2250%22 cy=%2218%22 r=%2211%22/%3E%3Ccircle cx=%2282%22 cy=%2250%22 r=%2211%22/%3E%3Ccircle cx=%2250%22 cy=%2282%22 r=%2211%22/%3E%3Ccircle cx=%2218%22 cy=%2250%22 r=%2211%22/%3E%3C/g%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2217%22 fill=%22%234A35B8%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
/* Layout: presenter strip on top; app shell below = nav rail | conversation or workspace | sliding evidence drawer.
   Single deliberate light look (the product's warm-white shell), with a dark focus panel for the officer's decision. */
:root {
  --ground: #f5f3ee; --surface: #ffffff; --sunk: #efebe3; --line: #e3ded3; --line-strong: #cfc8ba;
  --on-ink: #ffffff; --paper: #fbfaf6; --paper-ink: #2b2925; --hair: #f0ece5; --tint: #fcfbff; --bubble: #e9e5dc; --hover: #fbfaf7; --me: #2f6f8f;
  --ink: #161513; --ink-2: #4f4a42; --ink-3: #8a847a;
  --ember: #f2643a; --ember-ink: #1c0c05; --ember-soft: #fde9e1;
  --squad: #6a4cf5; --squad-ink: #3d2a9e; --squad-soft: #f2efff; --squad-line: #ddd5ff;
  --ok: #217a4c; --ok-soft: #e4f3ea; --warn: #8f5a00; --warn-soft: #fbeed3; --bad: #a8261c; --bad-soft: #fbe6e1;
  --night: #171614; --night-2: #23211e; --night-line: #3a3631; --night-ink: #f3efe8; --night-ink-2: #aaa398;
  --f-ui: "Inter Tight", "Inter", system-ui, sans-serif; --f-mono: "Geist Mono", ui-monospace, monospace; --f-doc: "Newsreader", Georgia, serif;
  --r: 14px; --shadow: 0 1px 2px rgba(22,21,19,.04), 0 8px 28px rgba(22,21,19,.07);
  color-scheme: light;
}
/* colour variants: same meanings (red breach, amber attention, green verified, lavender = Squad), different grounds */
:root[data-look="cool"] { --ground: #f1f3f6; --sunk: #e7ebf0; --line: #dce1e8; --line-strong: #c3cad4; --ink: #13161b; --ink-2: #49505b; --ink-3: #737b87; --paper: #fafbfc; --hair: #edf0f4; --bubble: #e1e6ee; --hover: #f7f9fb; --me: #33557a; }
:root[data-look="lavender"] { --ground: #f4f2fb; --sunk: #ebe7f7; --line: #e0dbf0; --line-strong: #c9c1e4; --ink: #1a1726; --ink-2: #4d4862; --ink-3: #77718d; --paper: #fcfbff; --hair: #efecf8; --bubble: #e4def6; --hover: #f8f6fd; --me: #4a35b8; }
:root[data-look="sage"] { --ground: #f0f3ee; --sunk: #e5eae1; --line: #d9e0d4; --line-strong: #c0cab9; --ink: #151a14; --ink-2: #4a5347; --ink-3: #717b6c; --paper: #fbfcfa; --hair: #ecf0e9; --bubble: #dfe7da; --hover: #f7f9f5; --me: #3f6b4a; }
:root[data-look="night"] { color-scheme: dark; --ground: #141318; --surface: #1d1c22; --sunk: #25242b; --line: #2f2e36; --line-strong: #46444f; --ink: #f1eff5; --ink-2: #bbb7c6; --ink-3: #8a8695; --on-ink: #141318;
  --hair: #29282f; --tint: #211e2b; --bubble: #2d2b35; --hover: #232229; --me: #8f7bf0;
  --squad: #a493ff; --squad-ink: #cbbfff; --squad-soft: #262140; --squad-line: #3d3561;
  --ok: #7fd3a0; --ok-soft: #17301f; --warn: #f0c06a; --warn-soft: #36290f; --bad: #ff9b8f; --bad-soft: #3a1b17; --night: #201e26; --night-2: #2a2831; --night-line: #423f4b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--squad); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }


.mk { flex-shrink: 0; display: block; }
@keyframes sq-spin { to { transform: rotate(360deg); } }
@keyframes sq-breathe { 50% { transform: scale(0.86); } }
.mk .orbit { transform-box: view-box; transform-origin: 50% 50%; animation: sq-spin 9s linear infinite; }
.mk .core { transform-box: fill-box; transform-origin: center; animation: sq-breathe 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .mk .orbit, .mk .core { animation: none; } }

/* presenter strip */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: #161513; color: #f3efe8;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: #161513; }
.strip .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #a8a196; white-space: nowrap; }
.dots { display: flex; gap: 6px; }
.dot { width: 26px; height: 26px; border-radius: 13px; border: 1px solid #45413b; background: transparent; color: #a8a196; font-size: 12px; font-weight: 600; }
.dot[aria-current="step"] { background: #f3efe8; border-color: #f3efe8; color: #161513; }
.dot.done { background: #2d2a26; color: #f3efe8; }
.strip .hint { flex: 1 1 280px; min-width: 0; font-size: 14px; }
.strip .hint b { color: #fff; }
.strip .hint span { color: #bdb6aa; }
.strip .nav { display: flex; gap: 6px; }
.sbtn { height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid #45413b; background: transparent; color: #f3efe8; font-size: 13px; font-weight: 600; }
.sbtn.primary { background: #f3efe8; color: #161513; border-color: #f3efe8; }

/* shell */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
.rail { overflow-y: auto; }
.rail { border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; }
.who { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; }
.orb { width: 42px; height: 42px; border-radius: 21px; flex-shrink: 0; background: radial-gradient(circle at 34% 30%, #c3b5ff 0%, var(--squad) 55%, #34209a 100%); box-shadow: 0 0 0 4px var(--squad-soft); }
.orb.sm { width: 28px; height: 28px; box-shadow: none; }
.who b { display: block; font-size: 16px; }
.status { font-size: 12px; color: var(--squad-ink); display: flex; align-items: center; gap: 6px; }
.pulse { width: 7px; height: 7px; border-radius: 4px; background: var(--squad); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.navitem { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 11px; border: 1px solid transparent; background: transparent; font-size: 14px; color: var(--ink); }
.navitem:hover { background: var(--sunk); }
.navitem[aria-current="page"] { background: var(--surface); border-color: var(--line); font-weight: 600; }
.navgroup { font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 14px 12px 4px; }
.badge { min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.badge.ember { background: var(--ember); color: var(--ember-ink); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.avatar { width: 32px; height: 32px; border-radius: 16px; background: var(--ink); color: var(--on-ink); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.me small { display: block; color: var(--ink-3); font-size: 12px; }

.main { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 32px 24px; }
.col { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* messages */
.msg { display: flex; gap: 12px; align-items: flex-start; }
.msg.me-msg { justify-content: flex-end; }
.bubble-me { max-width: 560px; background: var(--bubble); border-radius: 16px 16px 4px 16px; padding: 12px 16px; }
.msgbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.meta { font-size: 12px; color: var(--ink-3); }
.meta b { color: var(--squad-ink); font-weight: 600; }
.text { font-size: 16px; line-height: 1.55; margin: 0; text-wrap: pretty; }
.anim { animation: rise .32s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .anim, .drawer, .toast { animation: none !important; transition: none !important; } .pulse { animation: none; } }
.typing { display: inline-flex; gap: 4px; padding: 10px 14px; background: var(--squad-soft); border-radius: 12px; }
.typing i { width: 6px; height: 6px; border-radius: 3px; background: var(--squad); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .25; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 18px 20px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { height: 42px; padding: 0 16px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); font-weight: 600; }
.btn.primary:hover { opacity: .9; }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--on-ink); font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--squad-ink); font-weight: 600; padding: 0 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.squad { background: var(--squad-soft); color: var(--squad-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.chip.file { background: var(--surface); }
.worklist { display: grid; gap: 8px; }
.workitem { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.workitem:hover { border-color: var(--line-strong); }
.workitem .n { font-family: var(--f-mono); color: var(--ink-3); font-size: 13px; }
.workitem span.t { flex: 1; font-weight: 600; }
.workitem small { color: var(--ink-3); }

/* track record band */
.trust { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 10px; background: var(--squad-soft); color: var(--squad-ink); font-size: 13px; }
.trust b { font-variant-numeric: tabular-nums; }

/* work trail */
.trail { border: 1px solid var(--squad-line); border-radius: 14px; background: var(--surface); }
.trail > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 0; background: transparent; text-align: left; font-size: 13px; color: var(--ink-2); }
.trail > button b { color: var(--squad-ink); }
.trail ol { list-style: none; margin: 0; padding: 0 14px 8px; }
.trail li { display: grid; grid-template-columns: 22px 150px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--hair); font-size: 13px; align-items: start; animation: rise .3s ease-out both; }
.trail li .k { font-family: var(--f-mono); color: var(--ink-3); }
.trail li .who2 b { display: block; } .trail li .who2 small { display: block; font-size: 11px; color: var(--ink-3); line-height: 1.3; }
.trail li .ck { color: var(--ok); white-space: nowrap; }

/* composer */
.composer { padding: 12px 32px 22px; }
.composer .box { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px dashed var(--line-strong); border-radius: 16px; padding: 7px 7px 7px 10px; transition: border-color .2s, background .2s; }
.composer .box.over { border-color: var(--squad); background: var(--squad-soft); }
.composer input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 40px; font-size: 15px; }
.iconbtn { width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; }
.iconbtn.dark { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }

/* portfolio */
.ptitle { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.ptitle h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; text-wrap: balance; }
.legend { margin-left: auto; font-size: 13px; color: var(--ink-2); display: flex; gap: 14px; flex-wrap: wrap; }
.tablewrap { container-type: inline-size; }
table.port { width: 100%; border-collapse: collapse; font-size: 14px; }
.port .co small { display: block; font-size: 12px; }
.port td.nx { font-size: 13px; color: var(--ink-2); min-width: 120px; }
@container (max-width: 860px) { .port .sp { display: none; } .port th, .port td { padding-inline: 10px; } .port .tag { white-space: normal; height: auto; min-height: 24px; padding-block: 3px; line-height: 1.3; } .port td.nx { min-width: 96px; } }
.colink { border: 0; background: transparent; padding: 0; text-align: left; font-weight: 700; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.colink:hover { text-decoration-color: var(--ink); }
.port tr[data-co] { cursor: pointer; }
.port th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.port th.r, .port td.r { text-align: right; }
.port td { padding: 13px 14px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
.port tr.watch td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.port tr.alert td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.port tr:hover td { background: var(--hover); }
.co b { display: block; } .co small { color: var(--ink-3); }
.rml { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rml.bad { color: var(--bad); } .rml.warn { color: var(--warn); }
.def { font-size: 12px; color: var(--ink-3); }

/* review split */
.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0; }
.page { background: var(--paper); border-right: 1px solid var(--line); padding: 28px 34px; font-family: var(--f-doc); font-size: 14px; color: var(--paper-ink); display: flex; flex-direction: column; gap: 8px; border-radius: var(--r) 0 0 var(--r); }
.page .ln { display: flex; justify-content: space-between; gap: 12px; padding: 2px 6px; border-radius: 3px; }
.page .ln span:last-child { font-variant-numeric: tabular-nums; }
.page .hl { outline: 2px solid var(--squad); outline-offset: 2px; background: var(--squad-soft); }
.page .hl2 { outline: 2px solid var(--warn); outline-offset: 2px; background: var(--warn-soft); }
.page .synth { margin-top: auto; text-align: center; font-family: var(--f-ui); font-size: 10px; letter-spacing: .1em; color: var(--ink-3); }
.ask { padding: 24px 26px; display: flex; flex-direction: column; gap: 14px; }
.choice { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
.choice:has(input:checked) { border-color: var(--ink); }
.choice input { margin-top: 3px; accent-color: var(--ink); width: 17px; height: 17px; }
.choice small { display: block; color: var(--ink-3); }
.teach { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--squad-soft); color: var(--squad-ink); font-size: 14px; }
.teach input { accent-color: var(--squad); width: 17px; height: 17px; margin-top: 2px; }
textarea.field { width: 100%; min-height: 84px; resize: none; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px 14px; background: var(--surface); font-size: 14px; line-height: 1.5; }
label.lbl { font-size: 13px; font-weight: 600; }

/* drawer */
.scrim { position: absolute; inset: 0; background: rgba(22,21,19,.08); opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -18px 0 40px rgba(22,21,19,.10); transform: translateX(104%); transition: transform .32s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; z-index: 20; }
.drawer.on { transform: none; }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.drawer header b { flex: 1; }
.grip { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: col-resize; z-index: 2; }
.grip::after { content: ""; position: absolute; left: 3px; top: 50%; width: 4px; height: 40px; margin-top: -20px; border-radius: 2px; background: var(--line-strong); }
.drawer .body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.clause { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; font-family: var(--f-doc); font-size: 15px; line-height: 1.7; display: flex; flex-direction: column; gap: 10px; }
.clause mark { background: var(--squad-soft); outline: 2px solid var(--squad); outline-offset: 3px; border-radius: 2px; color: inherit; }
.verified { font-size: 12px; color: var(--ok); font-weight: 600; }
.calc { font-family: var(--f-mono); font-size: 13px; line-height: 1.9; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.calc .tot { border-top: 1px solid var(--line-strong); margin-top: 4px; padding-top: 4px; font-weight: 600; }

/* recommendation + email */
.doc { font-family: var(--f-doc); font-size: 16px; line-height: 1.6; color: var(--ink); }
.doc h3 { font-family: var(--f-ui); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 0 0 6px; }
.squadmark { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--squad-ink); }
.email { border: 1.5px dashed var(--squad-line); border-radius: 14px; background: var(--tint); }
.email .hd { padding: 10px 14px; border-bottom: 1px solid var(--squad-line); font-size: 13px; color: var(--ink-2); display: flex; gap: 12px; flex-wrap: wrap; }
.email textarea { border: 0; background: transparent; width: 100%; min-height: 110px; padding: 12px 14px; resize: none; overflow: hidden; font-size: 14px; line-height: 1.55; }

/* officer */
.night { background: var(--night); color: var(--night-ink); border-radius: 18px; padding: 26px 28px; display: flex; flex-direction: column; gap: 18px; }
.night .k3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.night .k3 div { background: var(--night-2); border: 1px solid var(--night-line); border-radius: 12px; padding: 12px 14px; }
.night .k3 small { color: var(--night-ink-2); display: block; font-size: 12px; }
.night .k3 b { font-size: 26px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.night .opt { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--night-line); }
.night .opt:has(input:checked) { border-color: var(--night-ink); }
.night .opt input { accent-color: var(--night-ink); width: 17px; height: 17px; }
.night textarea { background: var(--night-2); border-color: var(--night-line); color: var(--night-ink); }
.night .muted { color: var(--night-ink-2); font-size: 13px; }
.night .btn { background: transparent; color: var(--night-ink); border-color: var(--night-line); }
.night .btn.primary { background: var(--night-ink); border-color: var(--night-ink); color: #161513; }

/* toast */

  function prompt(ctx, q, history, retryNote) {
    return `You are Squad, the assistant of Carly Reyes, a commercial credit analyst at Bank of Stoic. Everything here is fictional demonstration data.

- If the evidence doesn't answer the question, set "answerable" to false and say in one sentence what is missing.
- Warm, plain and brief: one to three sentences, no markdown, no lists. Speak to Carly as "you".
- "cites" lists the ids of the evidence items you relied on.
${retryNote ? "- " + retryNote + "\n" : ""}Reply with only JSON: {"answer": string, "cites": [string], "answerable": boolean}

Evidence:
${packText(ctx)}
${history.length ? "\nEarlier in this chat:\n" + history.map((h) => `Carly: ${h.q}\nSquad: ${h.answer}`).join("\n") + "\n" : ""}

  function scripted(ctx, q) {
    const hit = (SCRIPTED[ctx] || []).find(([re]) => re.test(q));
    return hit ? { answer: hit[1], cites: hit[2], answerable: true } : { answer: "I can't answer that from the evidence I have here.", cites: [], answerable: false };
  }

  async function ask(q) {
    const ctx = ctxOf();
    const a = { ctx, q, status: "working", phase: "Reading the evidence", answer: "", cites: [], traced: 0, mode: "", note: "" };
    run.asks.push(a); const i = run.asks.length - 1;
    render();
    const upd = () => { presence(); const el = $("ask-" + i); if (el) { el.outerHTML = askHtml(a, i); const p = $("pane"); p.scrollTop = p.scrollHeight; } };
    const history = run.asks.filter((x, j) => j < i && x.ctx === ctx && x.status === "done").slice(-3);
    let res = null, mode = "scripted", guard = "";
    while (!sampleReady) await new Promise((r) => setTimeout(r, 100));
    const live = sampleFn ? (note) => sampleFn.json(prompt(ctx, q, history, note), note ? { modelTier: "quick", cache: false } : { modelTier: "quick" })
      : serverOk ? (note) => serverAsk(ctx, q, history, note) : null;
    if (live) {
      try {
        res = await live("");
        mode = "live";
        a.phase = "Checking every figure against the evidence"; upd();
        let chk = checkFigures(ctx, String(res?.answer || ""));
        if (chk.bad.length) {
          guard = `Retried once: ${chk.bad.join(", ")} did not trace to the evidence.`;
          a.phase = "A figure didn't trace. Asking again"; upd();
          res = await live(`Your last answer used numbers that are not in the evidence (${chk.bad.join(", ")}). Use only numbers exactly as they appear in the evidence, or say you can't answer.`);
          chk = checkFigures(ctx, String(res?.answer || ""));
          if (chk.bad.length) { res = { answer: "I can't answer that without a figure I can't trace to the evidence, so here's the evidence instead.", cites: [], answerable: false }; guard = `Stopped: ${chk.bad.join(", ")} did not trace to the evidence after one retry.`; }
        }
      } catch (e) {
        if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e?.code)) sampleFn = null;
        if (e?.code === "unavailable") serverOk = false;
        if (e?.code === "rate_limited") { a.status = "done"; a.answer = "I'm being asked too much at once. Try again in a moment."; a.mode = "error"; return upd(); }
        res = null;
      }
    }
    if (!res) { await new Promise((r) => setTimeout(r, 700)); res = scripted(ctx, q); mode = "scripted"; }
    const chk = checkFigures(ctx, String(res.answer || ""));
    a.answer = String(res.answer || ""); a.answerable = res.answerable !== false;
    const seen = new Set();
    a.cites = (Array.isArray(res.cites) ? res.cites : []).map(String).filter((id) => { const l = itemLabel(ctx, id); if (!l || seen.has(l.toLowerCase())) return false; seen.add(l.toLowerCase()); return true; });
    a.traced = chk.traced; a.list = chk.list; a.mode = mode; setTimeout(speak, 0); a.note = guard; a.status = "done";
    upd();
  }

            <label class="choice"><input type="radio" name="line" value="deferred" ${s.line === "deferred" ? "checked" : ""}><span><b>Deferred revenue, current</b><small><span class="tag squad" style="height:20px;font-size:11px;margin-right:6px">Squad's guess</span>Most likely: subscription billed ahead</small></span></label>
            <label class="choice"><input type="radio" name="line" value="other" ${s.line === "other" ? "checked" : ""}><span><b>Other current liabilities</b><small>If it isn't customer prepayments</small></span></label>
            <label class="teach"><input type="checkbox" id="remember" ${s.remember ? "checked" : ""}><span>Remember for Stripple Tech. Next month this goes through without asking you.</span></label>
            <div class="row"><button class="btn primary" type="button" data-act="confirm" id="confirmbtn" ${s.line ? "" : "disabled"}>Confirm</button><span class="meta">Recorded on the ledger with your name</span></div>
            <div>${dive("fig:contract")}</div>`}
            <button class="btn ghost" type="button" data-act="tab" data-tab="spread" style="padding:0;align-self:flex-start">See it in the spread →</button>
        </div>`}
        </div>
      </div>
    </div>`;
  }

  function viewPrepare() {
    return `<div class="card pad anim" style="display:flex;flex-direction:column;gap:16px">
      <div class="row"><span class="tag bad">Covenant miss</span><b>Dataflake Inc · minimum unrestricted cash</b><span class="meta" style="margin-left:auto">Analysts recommend; a credit officer decides</span></div>
      <div class="doc"><h3>Drafted by Squad</h3>
        Unrestricted cash at 31 October was <b>$4.6M</b> against a <b>$5.0M</b> minimum. The certificate's <b>$5.3M</b> includes <b>$0.7M</b> pledged for a letter of credit, which §1.1 excludes. Net burn averages <b>$0.65M</b> a month, so RML is about <b>7 months</b>. A Series B extension of <b>$8M</b> is signed and expected to close in December.
        <div style="margin-top:8px;font-family:var(--f-ui);font-size:13px;color:var(--ink-2)">Options: one-time waiver conditioned on funding · reservation of rights · default notice</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="view">Your view (required to route)</label><textarea class="field" id="view" placeholder="What do you recommend, and why?" ${s.routed ? "readonly" : ""}>${esc(run.view)}</textarea>${s.routed ? "" : `<button class="suggest" type="button" data-act="fill" data-to="view" data-text="${esc(SUGGESTED_VIEW)}">Start from Squad's suggestion</button>`}</div>
      <div class="email">
        <div class="hd"><span>To: cfo@dataflake.example</span><span>From: Carly Reyes</span><span class="squadmark">drafted by Squad</span>${run.mailSent ? '<span class="tag ok" style="margin-left:auto">Sent</span>' : ""}</div>
        <label for="mail" style="position:absolute;left:-9999px">Email to Dataflake's CFO</label>
        <textarea id="mail" ${run.mailSent ? "readonly" : ""}>Hi Marcus,\n\nOur October test shows unrestricted cash of $4.6M against the $5.0M minimum; the $0.7M in the pledged account is excluded under §1.1. Could you send us the signed Series B extension term sheet?${run.certChoice === "email" ? " Could you also tell us why the certificate counted the cash held for the letter of credit?" : ""} We'll come back to you on next steps this week.\n\nThanks,\nCarly</textarea>
      </div>
      ${run.mailSent ? '<div class="proto">Sent as Carly · prototype: nothing was really sent</div>' : ""}
      <div class="row">${run.mailSent ? "" : '<button class="btn" type="button" data-act="sendmail">Send email as Carly</button>'}${s.routed ? "" : '<button class="btn primary" type="button" data-act="route">Route to Helen Strand</button>'}<span class="meta">Squad never sends to a client on its own</span></div>
    </div>`;
  }

  function routedMsg() {
    return squadMsg(`<p class="text">Routed to Helen Strand at 9:52 with your view. I'll tell you when she decides.</p>
      <div class="row"><button class="btn dark" type="button" data-act="toHelen">See it as Helen →</button><span class="meta">The demo switches to the credit officer</span></div>`, "Squad · 9:52 am", true);
  }
  function viewHelen() {
    const second = s.sentBack;
    return `<div class="col" style="max-width:860px">
      <div class="meta">Helen Strand · credit officer · 1 approval waiting${second ? " · back from Carly" : ""}</div>
      <div class="night anim">
        <div class="row"><span class="tag bad">Covenant miss</span><span class="muted">Dataflake Inc · ${second ? "sent back by Carly Reyes at 10:52" : "routed by Carly Reyes at 9:52"}</span></div>
        <div style="font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;text-wrap:balance">Grant Dataflake a one-time waiver, conditioned on the $8M extension closing by 15 December?</div>
        <div class="k3"><div><small>Unrestricted cash</small><b>$4.6M</b></div><div><small>Minimum</small><b>$5.0M</b></div><div><small>RML</small><b>7.1 mo</b></div></div>
        <div style="font-size:15px;color:#e1dbd0"><b style="color:#d7ccff">Carly recommends:</b> “${esc(run.view || SUGGESTED_VIEW)}”</div>
        ${second ? `<div style="font-size:15px;color:#e1dbd0;border-top:1px solid var(--night-line);padding-top:14px"><b style="color:#d7ccff">You returned it:</b> “${esc(s.helenReason || run.helenReason)}”<br><b style="color:#d7ccff">Added since:</b> the signed term sheet: $8M from the two existing investors, closing 12 December. <button class="btn ghost" type="button" data-act="termsheet" style="color:#cfc3ff;height:auto;padding:0">Open the term sheet</button></div>` : ""}
        <div class="muted">Prepared by Squad · checked by Carly · every figure sourced · <button class="btn ghost" type="button" data-act="drawer" style="color:#cfc3ff;height:auto;padding:0">see the evidence</button></div>
        <fieldset style="border:0;margin:0;padding:0;display:grid;gap:8px"><legend class="muted" style="margin-bottom:8px">Your decision</legend>
          <label class="opt"><input type="radio" name="hd" value="approve" ${s.helen === "approve" ? "checked" : ""}>Approve the conditional waiver</label>
          <label class="opt"><input type="radio" name="hd" value="reserve" ${s.helen === "reserve" ? "checked" : ""}>Reserve rights</label>
          <label class="opt"><input type="radio" name="hd" value="return" ${s.helen === "return" ? "checked" : ""}>Return to Carly</label></fieldset>
        <label class="muted" for="hreason">Reason (required)</label>
        <textarea class="field" id="hreason" placeholder="Your reason goes on the ledger with the decision"></textarea>
        <button class="suggest" type="button" data-act="fill" data-to="hreason" data-text="${second ? APPROVE_REASON : RETURN_REASON}">Demo: use a sample reason</button>
        <div class="row"><button class="btn primary" type="button" data-act="helenrecord">Record decision</button><span class="muted">Recorded on the ledger with your name and reason</span></div>
        <div>${dive("case:dataflake")}</div>
      </div>
    </div>`;
  }

  function termSheet() {
    return `<div class="grip" title="Drag to resize" aria-hidden="true"></div><header><b>Series B extension · term sheet · page 1 of 3</b><button class="iconbtn" type="button" data-act="closedrawer" aria-label="Close">${ico.x}</button></header>
      <div class="body">
        <div class="clause">
          <div style="text-align:center;font-weight:600">SUMMARY OF TERMS · SERIES B-2 PREFERRED</div>
          <div><b>Company:</b> <mark>Dataflake Inc</mark></div>
          <div><b>Amount:</b> <mark>$8,000,000</mark>, from the Company's two existing lead investors</div>
          <div><b>Closing:</b> on or before <mark>12 December 2026</mark></div>
          <div><b>Signatures:</b> the Company and both investors, dated 17 November 2026</div>
          <div style="margin-top:6px;text-align:center;font-family:var(--f-ui);font-size:10px;letter-spacing:.1em;color:var(--ink-3)">SYNTHETIC · FOR DEMONSTRATION</div>
        </div>
        <div class="verified">✓ Company name, amount and date found on page 1 by code</div>
        <div class="trust">The waiver Carly proposes holds only if this $8M arrives by 15 December. Closing on 12 December leaves three days' margin.</div>
        <div>${dive("case:dataflake")}</div>
      </div>`;
  }
  function drawer() {
    const d = $("drawer");
    if (s.drawerDoc === "ts") d.innerHTML = termSheet(); else d.innerHTML = `<div class="grip" title="Drag to resize" aria-hidden="true"></div><header><b>Loan agreement · §1.1 Definitions · page 4</b><button class="iconbtn" type="button" data-act="closedrawer" aria-label="Close">${ico.x}</button></header>
      <div class="body">
        <div class="clause">
          <div style="text-align:center;font-weight:600">LOAN AND SECURITY AGREEMENT</div>
          <div>“Unrestricted Cash” means cash and cash equivalents of the Borrower held in deposit accounts subject to a control agreement in favour of the Bank, <mark>excluding any cash pledged, escrowed or otherwise restricted, including cash securing letters of credit</mark>.</div>
          <div>7.10 <i>Minimum Unrestricted Cash.</i> The Borrower shall maintain Unrestricted Cash of not less than $5,000,000 at all times, tested monthly.</div>
          <div style="margin-top:6px;text-align:center;font-family:var(--f-ui);font-size:10px;letter-spacing:.1em;color:var(--ink-3)">SYNTHETIC · FOR DEMONSTRATION</div>
        </div>
        <div class="verified">✓ Quote found on page 4 by code</div>
        <div><div class="lbl" style="margin-bottom:6px">What it does to the test</div>
          <div class="calc">Cash, operating accounts&nbsp;&nbsp;&nbsp;&nbsp;4.6<br>Cash, pledged for LC&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;0.7<br>Certified total&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;5.3<div class="tot">Unrestricted (§1.1)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;4.6 &lt; 5.0 minimum</div></div>
          <div class="def" style="margin-top:6px">USD millions · calculated by code from stored facts</div></div>
        <div class="trust">${run.certAsked || (run.certChoice === "email" && run.mailSent) ? "Asked Dataflake's CFO why the certificate counted the pledged cash; waiting for the answer." : "Still open: Dataflake's CFO hasn't explained why the certificate counted the pledged cash."}</div>
        <div>${dive("cov:dataflake")}</div>
      </div>`;
    d.classList.toggle("on", s.drawer);
    // Push the case aside when there is room; on narrower screens fold the nav away to make room; overlay only on phones.
    const vw = innerWidth;
    if (s.drawer && vw > 900) {
      const railW = (c) => (c ? 72 : 252);
      if (!railC && vw - railW(false) - 420 < 480) { tempRail = true; document.body.classList.add("railc"); }
      const main = vw - railW(railC || tempRail);
      const dw = userDw ? Math.round(Math.max(340, Math.min(main - 360, userDw))) : Math.round(Math.max(380, Math.min(560, main * 0.42)));
      document.documentElement.style.setProperty("--dw", dw + "px");
      document.querySelector(".main").classList.toggle("push", main - dw >= 440);
    } else {
      document.querySelector(".main").classList.remove("push");
      document.documentElement.style.removeProperty("--dw");
      if (tempRail) { tempRail = false; document.body.classList.toggle("railc", railC); }
    }
    d.setAttribute("aria-hidden", s.drawer ? "false" : "true");
    $("scrim").classList.toggle("on", s.drawer);
  }

  // ---------- render ----------
  function render() {
    // strip
    $("dots").innerHTML = STEPS.map((x, i) => `<button class="dot ${i < step ? "done" : ""}" type="button" data-step="${i}" ${i === step ? 'aria-current="step"' : ""} aria-label="Step ${i + 1}: ${esc(x.t)}">${i + 1}</button>`).join("");
    $("hint").innerHTML = `<b>${step + 1} · ${STEPS[step].t}.</b> <span>${STEPS[step].h}</span> <b>Try:</b> <span>${STEPS[step].go}</span>`;
    $("prev").disabled = step === 0;
    $("next").textContent = step === STEPS.length - 1 ? (s.summary ? "Start over" : "Finish") : "Next step";
    rail();
    let html;
    const v = s.view;
    if (v.startsWith("cc:")) html = viewCC(v.slice(3));
    else if (helenView()) html = viewHelen();
    else if (v.startsWith("chat:")) html = viewChat(v.slice(5));
    else if (v === "portfolio" || (step === 1 && v !== "squad")) html = viewPortfolio();
    else if (step === 3 || step === 4) html = viewReview();
    else if (helenView()) html = viewHelen();
    else html = viewThread();
    const typed = {}; $("pane").querySelectorAll("textarea[id]").forEach((t) => { if (!t.readOnly) typed[t.id] = t.value; });
    $("pane").innerHTML = html;
    $("pane").querySelectorAll("textarea[id]").forEach((t) => { if (!t.readOnly && t.id in typed) t.value = typed[t.id]; });
    composer();
    drawer();
    $("pane").querySelectorAll("textarea").forEach(autosize);
    const thread = !v.includes(":") && v !== "portfolio";
    if (thread && step === 7 && s.summary) requestAnimationFrame(() => { const p = $("pane"), el = $("summary"); if (el) p.scrollTop = el.offsetTop - 24; });
    else if (thread && (step === 2 || step === 5 || step === 6 || (step === 7 && s.helenDone))) requestAnimationFrame(() => {
      // Bring the start of what's new to the top (e.g. Carly's attachments at step 3), not the bottom of the thread.
      const p = $("pane"), first = p.querySelector(".anim");
      if (first) p.scrollTop += first.getBoundingClientRect().top - p.getBoundingClientRect().top - 20; else p.scrollTop = p.scrollHeight;
    });
    else $("pane").scrollTop = 0;
  }
  function autosize(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; }
  document.addEventListener("input", (e) => { if (e.target.tagName === "TEXTAREA") autosize(e.target); });
  let liveTimer;
  function helenView() { return step === 7 && (!s.helenDone || (s.sentBack && !s.approved)) && !s.view.startsWith("cc:") && s.view !== "chat:lumora" && s.view !== "chat:stripple" && s.view !== "portfolio"; }
  function open(v) { s.stack.push(s.view); s.view = v; s.drawer = false; render(); }
  function go(n) {
    n = Math.max(0, Math.min(STEPS.length - 1, n));
    if (n === 0) resetRun();
    resetLocal();
    step = n;
    if (step >= 2) s.uploaded = true;
    if (run.caseChat && step >= 5) s.view = "chat:dataflake";   // a case opened in Dataflake's chat stays there
    setTimeout(speak, 0);
    clearTimeout(liveTimer);
    if (step === 5 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      s.live = true;
      liveTimer = setTimeout(() => { if (step === 5 && s.live) { s.live = false; s.trail = true; render(); speak(); } }, 3000);
    }
    render();
  }

  // ---------- actions ----------
  document.addEventListener("click", (e) => {
    if (lookOpen && !e.target.closest("#lookpop, [data-act=lookmenu]")) { lookOpen = false; lookMenu(); }
    const t = e.target.closest("[data-act],[data-step]");
    if (!t) return;
    if (t.dataset.step) return go(+t.dataset.step);
    const a = t.dataset.act;
    const val = (id) => ($(id) ? $(id).value : "");
    switch (a) {
      case "w1": run.caseChat = false; if (step < 2) return go(2); if (!run.line) return go(3); if (!run.fixed) return go(4); s.stack = []; s.view = "chat:stripple"; return render();
      case "w2": run.caseChat = true; if (step >= 5) { s.stack = []; s.view = "chat:dataflake"; return render(); } return go(5);   // open the case on its own, not the whole morning
      case "w3": return open("chat:lumora");
      case "co": { const c = CHATS.find((x) => x.co === t.dataset.co); return open(c ? "chat:" + c.id : "cc:co:" + t.dataset.co); }
      case "openchat": return open("chat:" + t.dataset.chat);
      case "cc": return open("cc:" + t.dataset.cc);
      case "home": s.view = s.stack.length ? s.stack.pop() : ""; return render();
      case "lumorasend": run.lumoraSent = true; render(); return toast("Reminder sent as Carly · <b>recorded</b> · prototype: nothing was really sent");
      case "back": if (step === 1) { s.view = "squad"; return render(); } return go(2);
      case "reqdraft": s.reqDraft = true; return render();
      case "reqcancel": s.reqDraft = false; return render();
      case "reqsend": run.reqSent = true; render(); return toast("Request sent as Carly · <b>recorded</b> · prototype: nothing was really sent");
      case "typo": run.typo = true; render(); return toast("Filed <b>mrr_export.xlsx</b> as October 2026, with your note");
      case "review": return go(3);
      case "confirm": {
        if (!s.line) return toast("Pick where it goes first.");
        const remember = $("remember")?.checked;
        run.line = s.line; run.remember = !!remember;
        toast(`Filed as <b>${s.line === "deferred" ? "deferred revenue, current" : "other current liabilities"}</b>${remember ? " · remembered for Stripple Tech" : ""}`);
        return setTimeout(() => go(4), 650);
      }
      case "right": return toast("In this walk-through Squad is wrong here. Try “That's wrong”.");
      case "wrong": s.wrong = true; s.page = 0; s.hl = ""; return render();
      case "unwrong": s.wrong = false; return render();
      case "fix": s.page = 0; s.hl = ""; if (!val("why").trim()) { toast("Say what's wrong first. That's what Squad learns from."); return $("why").focus(); } s.fixed = true; run.fixed = true; render(); return toast("Corrected · old figure kept in history · <b>ratios re-run</b>");
      case "toDataflake": return go(5);
      case "reviewfix": return go(4);
      case "trail": s.trail = !s.trail; return render();
      case "drawer": s.drawer = true; s.drawerDoc = ""; return drawer();
      case "termsheet": s.drawer = true; s.drawerDoc = "ts"; return drawer();
      case "closedrawer": s.drawer = false; return drawer();
      case "prep": return go(6);
      case "skiplive": s.live = false; s.trail = true; render(); return speak();
      case "certemail": run.certChoice = "email"; toast("Got it. I'll put the question in the email · drafting the case"); return setTimeout(() => go(6), 700);
      case "certfirst": run.certChoice = "first"; render(); return speak();
      case "certundo": run.certChoice = ""; return render();
      case "certsend": run.certAsked = true; render(); return toast("Question sent as Carly · <b>recorded</b> · prototype: nothing was really sent");
      case "sendmail": if ($("view")) run.view = $("view").value; run.mailSent = true; render(); return toast("Email sent as Carly · <b>recorded</b> · prototype: nothing was really sent");
      case "route": {
        const v = val("view").trim();
        if (!v) { toast("Add your view before routing. You can start from Squad's suggestion."); return $("view").focus(); }
        run.view = v; s.routed = true; render(); return speak();
      }
      case "toHelen": return go(7);
      case "tab": if ($("why")) s.why = $("why").value; s.tab = t.dataset.tab; return render();
      case "srow": if ($("why")) s.why = $("why").value; s.page = +t.dataset.page; s.hl = t.dataset.hl; render(); return $("docfocus")?.scrollIntoView({ block: "center" });
      case "page": if ($("why")) s.why = $("why").value; s.page = +t.dataset.page; s.hl = ""; return render();
      case "look": look = t.dataset.look; lookOpen = false; savePref("squad-look2", look); applyChrome(); return lookMenu();
      case "lookmenu": lookOpen = !lookOpen; return lookMenu();
      case "railc": railC = !railC; lookOpen = false; savePref("squad-rail2", railC ? "closed" : "open"); applyChrome(); return rail();
      case "showsummary": s.summary = true; s.view = ""; s.stack = []; run.caseChat = false; render(); return speak();   // the morning's summary lives in the main Squad thread
      case "fill": { const el = $(t.dataset.to); if (el) { el.value = t.dataset.text; autosize(el); el.focus(); } return; }
      case "helenrecord": {
        const r = val("hreason").trim();
        if (!r) return toast("A reason is required before the decision is recorded.");
        const choice = document.querySelector('input[name="hd"]:checked')?.value;
        if (!choice) return toast("Choose a decision first.");
        if (!r) { toast("A reason is required before the decision is recorded."); return $("hreason").focus(); }
        if (!s.sentBack) {
          if (choice !== "return") return toast("In this walk-through Helen returns it first. Choose “Return to Carly”.");
          s.helenReason = r; run.helenReason = r; s.helenDone = true; s.helen = ""; render();
          return toast("Returned to <b>Carly</b> with your reason · back in Carly's view");
        }
        if (choice !== "approve") return toast("In this walk-through Helen approves on the second pass. Choose “Approve the conditional waiver”.");
        s.approveReason = r; s.approved = true; render();
        return toast("Approved · <b>recorded</b> with your reason · back in Carly's view");
      }
      case "sendback": s.sentBack = true; s.helen = ""; render(); return toast("Sent back to <b>Helen Strand</b> with the signed term sheet · switching to Helen's view");
      case "restart": return go(0);
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target.name === "line") { s.line = e.target.value; if ($("confirmbtn")) $("confirmbtn").disabled = false; }
    if (e.target.id === "remember") s.remember = e.target.checked;
    if (e.target.name === "hd") s.helen = e.target.value;
  });
  // drag the drawer's left edge to resize it
  document.addEventListener("pointerdown", (e) => {
    if (!e.target.classList?.contains("grip")) return;
    e.preventDefault();
    const move = (ev) => { userDw = innerWidth - ev.clientX; drawer(); };
    const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
    addEventListener("pointermove", move); addEventListener("pointerup", up);
  });
  $("scrim").addEventListener("click", () => { s.drawer = false; drawer(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && lookOpen) { lookOpen = false; lookMenu(); }
    if (e.key === "Escape" && s.drawer) { s.drawer = false; drawer(); }
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
    if (e.key === "ArrowRight") go(step + 1);
    if (e.key === "ArrowLeft") go(step - 1);
  });
  $("prev").addEventListener("click", () => go(step - 1));
  $("next").addEventListener("click", () => {
    if (step === STEPS.length - 1) {
      if (s.summary) return go(0);
      s.helenReason = s.helenReason || run.helenReason || RETURN_REASON;
      s.approveReason = s.approveReason || APPROVE_REASON;
      s.helenDone = true; s.sentBack = true; s.approved = true; s.summary = true; s.view = ""; s.stack = []; s.drawer = false; return render();
    }
    go(step + 1);
  });
  $("restart").addEventListener("click", () => go(0));
  applyChrome();
  const setStripH = () => document.documentElement.style.setProperty("--striph", (document.body.classList.contains("noguide") ? 0 : document.querySelector(".strip").offsetHeight) + "px");
  const setGuide = (on) => { document.body.classList.toggle("noguide", !on); try { localStorage.setItem("squad-guide2", on ? "on" : "off"); } catch {} setStripH(); };
  $("hideguide").addEventListener("click", () => setGuide(false));
  $("showguide").addEventListener("click", () => setGuide(true));
  addEventListener("resize", setStripH);
  render(); speak();
  setGuide(pref("squad-guide2", "off") === "on");
  setStripH();
})();
</script>
