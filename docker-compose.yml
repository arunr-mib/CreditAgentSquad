# Local stack: database, API, background worker and workspace.
#   cp .env.example .env    (set SESSION_SECRET; ANTHROPIC_API_KEY only for live model runs)
#   docker compose up --build
#   docker compose exec api sh -c "cd /srv && python -m synthetic.generate && python -m app.seed_book"
# Workspace: http://localhost:8080   API: http://localhost:8000/api/v1/health
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: squad, POSTGRES_PASSWORD: squad, POSTGRES_DB: credit_agent_squad }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "squad"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://squad:squad@db:5432/credit_agent_squad
      FILE_STORE_DIR: /data/files
    volumes: [files:/data/files]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://squad:squad@db:5432/credit_agent_squad
      FILE_STORE_DIR: /data/files
    volumes: [files:/data/files]
    depends_on: { api: { condition: service_started } }
    command: ["python", "-m", "app.worker"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]
volumes: { dbdata: {}, files: {} }
