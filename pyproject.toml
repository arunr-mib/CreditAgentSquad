[project]
name = "credit-agent-squad"
version = "0.1.0"
description = "A fleet of AI agents for commercial lending."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "anthropic>=0.80",
  "pymupdf>=1.24",
  "reportlab>=4.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "synthetic/tests", "evals/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["synthetic/out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
