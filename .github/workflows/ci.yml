name: CI
on:
  push:
    branches: [main, "slice-*/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: squad
          POSTGRES_PASSWORD: squad
          POSTGRES_DB: credit_agent_squad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U squad" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      # Tests use recorded model responses only. Nothing billable runs in CI.
      - run: uv run pytest
        env:
          SQUAD_LLM_MODE: recorded

  frontend:
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck && pnpm test && pnpm build
        working-directory: frontend
